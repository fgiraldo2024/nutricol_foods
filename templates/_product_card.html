<article class="product-card" data-category="{{ product.categoria }}">
  <div class="product-image">
    <span class="product-index">{{ '%02d' | format(product.id | int) }}</span>
    <img src="{{ product.image_url }}" alt="{{ (product.titulo ~ ' — Colombian product available for business inquiries') if lang == 'en' else (product.titulo ~ ' — producto colombiano disponible para consulta comercial') }}" loading="lazy" width="400" height="400">
  </div>
  <div class="product-info">
    <h3>{{ product.titulo }}</h3>
    <p>{{ product.descripcion }}</p>
    <div class="product-bottom">
      <span class="small-label">{{ categories.get(product.categoria, product.categoria) if lang == "en" else product.categoria }}</span>
      <button class="add-product" type="button" data-add-product="{{ product.id }}" aria-label="{{ ('Add ' ~ product.titulo ~ ' to my selection') if lang == 'en' else ('Agregar ' ~ product.titulo ~ ' a mi selección') }}">{{ "Add" if lang == "en" else "Agregar" }} <span aria-hidden="true">＋</span></button>
    </div>
  </div>
</article>
